<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motif — session debug</title>
<style>
  :root {
    --bg: #101014;
    --panel: #18181f;
    --panel2: #1f1f29;
    --border: #2c2c3a;
    --text: #e8e8f0;
    --dim: #8b8ba0;
    --accent: #7aa2ff;
    --green: #6fd18b;
    --red: #f08080;
    --amber: #e8c268;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky; top: 0; z-index: 2;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .04em; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.tab.active { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: 420px 1fr; min-height: calc(100vh - 51px); }
  #list { border-right: 1px solid var(--border); overflow-y: auto; }
  .session {
    padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .session:hover { background: var(--panel); }
  .session.selected { background: var(--panel2); border-left: 3px solid var(--accent); padding-left: 13px; }
  .session .row1 { display: flex; gap: 8px; align-items: baseline; }
  .session .label { font-weight: 600; }
  .session .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .badge {
    font-size: 10px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--dim); text-transform: uppercase; letter-spacing: .06em;
  }
  .badge.persistent { color: var(--green); border-color: var(--green); }
  .badge.temporary { color: var(--amber); border-color: var(--amber); }
  .badge.expired { color: var(--red); border-color: var(--red); }
  #detail { overflow-y: auto; padding: 18px 22px; }
  .empty { color: var(--dim); padding: 40px; text-align: center; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 22px 0 8px; }
  h2:first-child { margin-top: 0; }
  pre {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 12px; margin: 0; white-space: pre-wrap; word-break: break-word;
  }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; text-transform: uppercase; font-size: 10px; letter-spacing: .06em; }
  td.type { color: var(--accent); white-space: nowrap; }
  td.dim, .dim { color: var(--dim); }
  details { margin: 2px 0; }
  summary { cursor: pointer; color: var(--dim); }
  a { color: var(--accent); }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: 4px 14px; font-size: 12px; }
  .kv .k { color: var(--dim); }
  .ok { color: var(--green); } .err { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>MOTIF · session debug</h1>
  <span class="sub" id="count"></span>
  <span class="spacer"></span>
  <button class="tab active" data-view="sessions">sessions</button>
  <button class="tab" data-view="log">action log</button>
  <button id="refresh">refresh</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select a session to inspect its manifest, canonical state, events, and artifacts.</div></div>
</main>
<script>
const $list = document.getElementById("list");
const $detail = document.getElementById("detail");
const $count = document.getElementById("count");
let view = "sessions";
let selected = null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (iso) => (iso ? iso.replace("T", " ").replace(/Z$/, "") : "—");

async function loadSessions() {
  const { sessions } = await (await fetch("/debug/api/sessions")).json();
  $count.textContent = `${sessions.length} session${sessions.length === 1 ? "" : "s"}`;
  if (!sessions.length) {
    $list.innerHTML = '<div class="empty">No sessions yet.<br>POST /actions/start_session to create one.</div>';
    return;
  }
  $list.innerHTML = sessions.map((s) => `
    <div class="session ${s.session_id === selected ? "selected" : ""}" data-id="${s.session_id}">
      <div class="row1">
        <span class="label">${esc(s.label || "(unlabeled)")}</span>
        <span class="badge ${s.mode}">${s.mode}</span>
        ${s.expired ? '<span class="badge expired">expired</span>' : ""}
        ${s.parent ? '<span class="badge">fork</span>' : ""}
      </div>
      <div class="meta">${s.session_id.slice(0, 12)}… · r${s.revision} · ${s.event_count} events</div>
      <div class="meta">created ${fmt(s.created_at)} · expires ${fmt(s.expires_at)}</div>
    </div>`).join("");
  for (const el of $list.querySelectorAll(".session")) {
    el.onclick = () => { selected = el.dataset.id; loadSessions(); loadDetail(selected); };
  }
}

async function loadDetail(id) {
  const r = await fetch(`/debug/api/sessions/${id}`);
  if (!r.ok) { $detail.innerHTML = '<div class="empty">Session not found (deleted?).</div>'; return; }
  const { manifest, context, events, artifacts } = await r.json();

  const kv = (obj) => '<div class="kv">' + Object.entries(obj)
    .map(([k, v]) => `<span class="k">${esc(k)}</span><span>${esc(typeof v === "object" && v !== null ? JSON.stringify(v) : v ?? "—")}</span>`)
    .join("") + "</div>";

  const eventsRows = events.slice().reverse().map((e) => `
    <tr>
      <td class="dim">r${e.revision}</td>
      <td class="type">${esc(e.type)}</td>
      <td class="dim">${fmt(e.at)}</td>
      <td><details><summary>${esc(summaryOf(e))}</summary><pre>${esc(JSON.stringify(e.payload, null, 2))}</pre></details></td>
    </tr>`).join("");

  const artifactRows = artifacts.length
    ? artifacts.map((a) => `<tr><td><a href="/debug/api/sessions/${id}/artifacts/${encodeURIComponent(a.name)}" target="_blank">${esc(a.name)}</a></td><td class="dim">${a.bytes} bytes</td></tr>`).join("")
    : '<tr><td class="dim" colspan="2">none</td></tr>';

  $detail.innerHTML = `
    <h2>Manifest</h2>
    ${kv({
      session_id: manifest.session_id, mode: manifest.mode, label: manifest.label,
      token_hash: manifest.token_hash, revision: manifest.revision,
      created_at: manifest.created_at, expires_at: manifest.expires_at,
      parent: manifest.parent,
    })}
    <h2>Canonical state</h2>
    <pre>${esc(JSON.stringify({
      brief: context.brief, banned_patterns: context.banned_patterns,
      pinned_references: context.pinned_references,
      current_prototype: context.current_prototype,
      global_feedback: context.global_feedback,
      event_summary: context.event_summary,
    }, null, 2))}</pre>
    <h2>Artifacts</h2>
    <table><tr><th>file</th><th>size</th></tr>${artifactRows}</table>
    <h2>Events (${events.length}, newest first)</h2>
    <table><tr><th>rev</th><th>type</th><th>at</th><th>payload</th></tr>${eventsRows || '<tr><td class="dim" colspan="4">none</td></tr>'}</table>`;
}

function summaryOf(e) {
  const p = e.payload || {};
  if (e.type === "brief_updated") return (p.brief || "").slice(0, 90);
  if (e.type === "feedback_stored") return (p.text || "").slice(0, 90);
  if (e.type === "inspo_stored") return (p.references || []).map((r) => r.title).join(", ").slice(0, 90);
  if (e.type === "inspo_pinned") return p.reference?.title || "";
  if (e.type === "prototype_stored") return `${p.direction || ""} — ${p.change_summary || ""}`.slice(0, 90);
  if (e.type === "search_logged") return p.query || "";
  return JSON.stringify(p).slice(0, 90);
}

async function loadLog() {
  const { entries } = await (await fetch("/debug/api/action_log")).json();
  $list.innerHTML = '<div class="empty">Per-action observability trace.<br>No raw tokens are ever logged.</div>';
  $detail.innerHTML = `
    <h2>Action log (${entries.length} recent, newest first)</h2>
    <table>
      <tr><th>at</th><th>action</th><th>ok</th><th>latency</th><th>session</th><th>detail</th></tr>
      ${entries.map((e) => `
        <tr>
          <td class="dim">${fmt(e.at)}</td>
          <td class="type">${esc(e.action)}</td>
          <td class="${e.ok ? "ok" : "err"}">${e.ok ? "ok" : esc(e.error || "err")}</td>
          <td class="dim">${e.latency_ms ?? "—"} ms</td>
          <td class="dim">${e.session_id ? e.session_id.slice(0, 12) + "…" : "—"}</td>
          <td class="dim">${e.result_count !== undefined ? e.result_count + " results" : ""} ${esc(e.provider || "")}</td>
        </tr>`).join("") || '<tr><td class="dim" colspan="6">empty</td></tr>'}
    </table>`;
}

function render() {
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
  if (view === "sessions") {
    loadSessions();
    if (selected) loadDetail(selected);
    else $detail.innerHTML = '<div class="empty">Select a session to inspect its manifest, canonical state, events, and artifacts.</div>';
  } else {
    loadLog();
  }
}

document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => { view = b.dataset.view; render(); }));
document.getElementById("refresh").onclick = render;
render();
setInterval(() => { if (!document.hidden) render(); }, 10_000);
</script>
</body>
</html>
